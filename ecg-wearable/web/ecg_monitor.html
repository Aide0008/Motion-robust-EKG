<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECG Monitor</title>
<style>
:root{
  --bg:#1c1d21; --panel:#26282d; --line:#34363c; --ink:#e9eaee; --muted:#9a9ea8;
  --accent:#e5484d; --ok:#3fb950; --warn:#e0a030;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;
}
header{
  display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;
  padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:#6b7079;flex:none}
.dot.live{background:var(--ok);box-shadow:0 0 0 3px rgba(63,185,80,.25)}
.dot.frozen{background:var(--warn)}
.dot.warn{background:var(--accent)}
.status{font-weight:400;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-left:auto}
button{
  font:inherit;color:var(--ink);background:#33363d;border:1px solid #454851;
  border-radius:8px;padding:7px 14px;cursor:pointer;
}
button:hover{background:#3d414a}
button.primary{background:#2f6fe4;border-color:#2f6fe4;color:#fff}
button.primary:hover{background:#4079ee}
button.on{background:var(--warn);border-color:var(--warn);color:#1b1b1b}
label{display:flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
select,input[type=number]{
  font:inherit;color:var(--ink);background:#1f2125;border:1px solid #454851;
  border-radius:6px;padding:5px 8px;
}
input[type=number]{width:80px}
main{
  flex:1;min-height:0;overflow:auto;padding:16px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.paper{
  position:relative;width:100%;border-radius:6px;overflow:hidden;
  background:#fff7f5;box-shadow:0 6px 24px rgba(0,0,0,.35);flex:none;
}
canvas{display:block;width:100%}
.banner{
  position:absolute;left:50%;top:12px;transform:translateX(-50%);
  background:var(--accent);color:#fff;font-weight:600;font-size:13px;
  padding:6px 14px;border-radius:999px;white-space:nowrap;
}
.tag{
  position:absolute;right:12px;top:12px;font-size:12px;font-weight:600;letter-spacing:.04em;
  padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.08);color:#5a4a4a;
}
.tag.live{background:rgba(63,185,80,.18);color:#1f6b2d}
.tag.ch{right:auto;left:12px;background:#1f2125;color:#fff;font-size:13px}
.tag.frozen{background:rgba(224,160,48,.25);color:#7a5200}
.tag.rev{background:rgba(47,111,228,.16);color:#1b4aa8}
.bpm{position:absolute;right:12px;top:44px;display:flex;align-items:baseline;gap:6px;padding:4px 12px;border-radius:10px;background:rgba(255,255,255,.72);color:#8f1d22;font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.bpm small{font-size:12px;font-weight:600;letter-spacing:.05em;color:#8f1d22;opacity:.8}
.bpm.dim{color:#9a8686}.bpm.dim small{color:#9a8686}
button.rec{border-color:#7a2a2e}
button.rec.live{background:var(--accent);border-color:var(--accent);color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.72}}
button:disabled{opacity:.45;cursor:default}
.rvbar{width:100%;display:flex;flex-direction:column;gap:8px;flex:none}
.rvrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.rvrow .time{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;min-width:120px}
.rvrow .file{color:var(--muted);margin-left:auto;font-size:13px}
#tl{width:100%;height:64px;border-radius:6px;background:#202228;cursor:pointer;touch-action:none}
.rvsum{color:var(--muted);font-size:13px}
.rvsum b{color:var(--ink);font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
.sw:first-child{margin-left:0}
[hidden]{display:none!important}
.info{color:var(--muted);font-size:13px;text-align:center;max-width:1100px}
.info b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot" id="dot"></span>ECG Monitor <span class="status" id="status">Not connected</span></div>
  <div class="controls">
    <button class="primary" id="btnConnect">Connect USB</button>
    <button class="primary" id="btnBle" title="Wireless: Chrome or Edge on a computer, or Chrome on Android">Connect Bluetooth</button>
    <button id="btnDemo">Demo</button>
    <button id="btnFreeze" title="Space bar">Freeze</button>
    <button id="btnRec" class="rec" title="Save everything coming in (the untouched signal) to a CSV file you can open again later">● Record</button>
    <button id="btnOpen" title="Open a saved recording and scroll back through it">Open recording…</button>
    <button id="btnLive" hidden>← Back to live</button>
    <input type="file" id="fileIn" accept=".csv,.txt,text/csv,text/plain" hidden>
    <label>Seconds on screen
      <select id="selWin"><option>6</option><option>8</option><option>10</option><option>12</option><option>15</option></select>
    </label>
    <label>Style
      <select id="selMode"><option value="scroll">Scrolling</option><option value="sweep">Sweep</option></select>
    </label>
    <label>Module gain <input type="number" id="numGain" min="100" max="5000" step="50"></label>
    <label><input type="checkbox" id="chkSmooth"> Filter 60&nbsp;Hz</label>
    <label><input type="checkbox" id="chkIgnore"> Ignore leads-off</label>
    <label id="lblPick" hidden title="Two amplifier boards are being read at once. Best picks the cleaner one automatically; A or B forces one">Board <select id="selPick"><option value="auto">Best (auto)</option><option value="a">A</option><option value="b">B</option></select> <label style="margin-left:6px"><input type="checkbox" id="chkOther"> show other</label></label>
    <label id="lblBaud" title="Serial speed for Connect USB. The two-board sketch uses 460800; the older single-board sketches use 115200">USB speed <select id="selBaud"><option value="460800">460800</option><option value="115200">115200</option></select></label>
    <label title="How firmly the slow up-and-down drift of the line is removed. Firm makes P and T waves easier to see; it can bend the ST segment a little. Light is the original behaviour">Baseline <select id="selBase"><option value="off">Off (DC only)</option><option value="light">Light</option><option value="firm">Firm (0.5 Hz)</option></select></label>
    <label title="Remove muscle noise and static to reveal the underlying trace (Kalman smoother)"><input type="checkbox" id="chkDen"> Denoise</label>
    <label title="How hard the denoiser smooths. 1.0 = the tuned default; lower keeps more detail, higher removes more noise">Strength <input type="range" id="rngStr" min="0.4" max="2" step="0.1" style="width:80px"> <span id="strVal" style="min-width:28px"></span></label>
    <label title="Draw the untouched signal in light grey underneath, so you can check the denoiser is not changing the beats"><input type="checkbox" id="chkUnder"> Show raw underneath</label>
    <label id="lblNoise" title="Demo only: add simulated muscle noise that comes and goes" hidden><input type="checkbox" id="chkNoise"> Muscle noise (demo)</label>
    <label title="Show the trace this many seconds late, so bad stretches can be removed before they are drawn">Delay <input type="range" id="rngDelay" min="0" max="4" step="0.1" style="width:90px"> <span id="delayVal" style="min-width:34px"></span></label>
    <label title="What to show where the mux switched electrodes: join the two sides, leave it blank, or draw a flat line">Gap <select id="selGap"><option value="splice">Splice</option><option value="blank">Blank</option><option value="flat">Flat line</option></select></label>
    <label title="After the mux switches electrodes, pause the line while the amplifier settles"><input type="checkbox" id="chkHide"> Hide settling after switch</label>
  </div>
</header>
<main id="main">
  <div class="paper" id="paper">
    <canvas id="cv"></canvas>
    <div class="banner" id="banner" hidden></div>
    <div class="tag" id="tag"></div>
    <div class="tag ch" id="chTag" hidden></div>
    <div class="bpm" id="bpm" hidden title="Heart rate estimated from the last 8 seconds shown (median beat-to-beat interval)"></div>
  </div>
  <div class="rvbar" id="rvbar" hidden>
    <div class="rvrow">
      <button id="rvBack" title="Back 10 s (Shift+←)">⟲ 10 s</button>
      <button id="rvPlay" class="primary" title="Space bar">▶ Play</button>
      <button id="rvFwd" title="Forward 10 s (Shift+→)">10 s ⟳</button>
      <label>Speed <select id="rvSpeed"><option value="1">1×</option><option value="2">2×</option><option value="5">5×</option><option value="10">10×</option></select></label>
      <span class="time" id="rvTime"></span>
      <span class="file" id="rvFile"></span>
    </div>
    <canvas id="tl" title="Whole recording. Click or drag to jump. Colour = electrode used, height = noise"></canvas>
    <div class="rvsum" id="rvSum"></div>
  </div>
  <div class="info" id="info"></div>
</main>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const FS = 250;            // samples per second sent by the ESP32 sketch
const MAINS = 60;          // Hz. Use 50 outside the Americas.
const MM_PER_S = 25;       // standard ECG paper speed
const MM_PER_MV = 10;      // standard ECG sensitivity
const KEEP_S = 40;         // seconds of history kept in memory
const SAT_HI = 3100, SAT_LO = 170;   // pin mV at or beyond these = the amplifier/ADC is pinned at a rail (the real signal is lost)
const SETTLE_S = 2.5;      // seconds the line is paused after the mux switches electrodes
const LAG_S = 0.5;         // live denoiser: a sample is final once this much newer signal has arrived
const DEN_DELAY = 0.62;    // so with Denoise on the picture is never less than this far behind
const DEN_WIN_S = 8, DEN_STEP = 25, DEN_MARGIN = 1 * FS;   // live denoiser re-smooths the last 8 s every 25 samples
const TRACE_RAW = '#b79f9f';
const CHCOL = ['#8a8f9a', '#4f8cff', '#f0a030', '#4cc38a', '#c678dd', '#e5484d', '#3cc4d9', '#d4d070', '#b0b0b0'];  // index = channel + 1
const PAPER = '#fff7f5', GRID_MINOR = '#f5cdcd', GRID_MAJOR = '#e79a9a', TRACE = '#111';

const $ = id => document.getElementById(id);
const el = {
  dot: $('dot'), status: $('status'), connect: $('btnConnect'), ble: $('btnBle'), demo: $('btnDemo'),
  freeze: $('btnFreeze'), win: $('selWin'), mode: $('selMode'), gain: $('numGain'),
  smooth: $('chkSmooth'), ignore: $('chkIgnore'), hide: $('chkHide'), gapSel: $('selGap'), delay: $('rngDelay'), delayVal: $('delayVal'), main: $('main'), paper: $('paper'),
  cv: $('cv'), banner: $('banner'), tag: $('tag'), chTag: $('chTag'), info: $('info'),
  rec: $('btnRec'), open: $('btnOpen'), live: $('btnLive'), fileIn: $('fileIn'),
  den: $('chkDen'), str: $('rngStr'), strVal: $('strVal'), under: $('chkUnder'), noise: $('chkNoise'), lblNoise: $('lblNoise'),
  rvbar: $('rvbar'), rvBack: $('rvBack'), rvPlay: $('rvPlay'), rvFwd: $('rvFwd'), rvSpeed: $('rvSpeed'),
  rvTime: $('rvTime'), rvFile: $('rvFile'), tl: $('tl'), rvSum: $('rvSum'),
  baseSel: $('selBase'), bpm: $('bpm'), pick: $('selPick'), lblPick: $('lblPick'), other: $('chkOther'), baud: $('selBaud'),
};
const ctx = el.cv.getContext('2d');

/* ---------- settings ---------- */
const cfg = { win: 10, gain: 1100, smooth: true, ignore: false, mode: 'scroll', hideSettle: true, delay: 0.5, gapMode: 'splice', denoise: true, dstr: 1, under: true, demoNoise: false, baseline: 'light', pick: 'auto', other: false, baud: 460800 };
try { Object.assign(cfg, JSON.parse(localStorage.getItem('ecgCfg') || '{}')); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem('ecgCfg', JSON.stringify(cfg)); } catch (e) {} };
el.win.value = String(cfg.win); el.mode.value = cfg.mode; el.gain.value = cfg.gain;
el.smooth.checked = cfg.smooth; el.ignore.checked = cfg.ignore; el.hide.checked = cfg.hideSettle;
el.gapSel.value = cfg.gapMode;
el.pick.value = cfg.pick; el.other.checked = cfg.other; el.baud.value = String(cfg.baud);
el.baseSel.value = cfg.baseline; el.den.checked = cfg.denoise; el.under.checked = cfg.under; el.noise.checked = cfg.demoNoise;
const showStr = () => { el.str.value = cfg.dstr; el.strVal.textContent = cfg.dstr.toFixed(1) + '×'; };
showStr();
const effDelay = () => cfg.denoise ? Math.max(cfg.delay, DEN_DELAY) : cfg.delay;   // how far behind the picture runs
const showDelay = () => { el.delay.value = cfg.delay; el.delayVal.textContent = cfg.delay.toFixed(1) + ' s'; };
showDelay();

/* DENOISER START — Kalman (integrated random walk) + RTS smoother. Pure functions, no page state. */
const DN = (() => {
  const FS = 250, SQ = Math.SQRT1_2;
  const PARAMS = { ql: 300, qh: 8e4, rho: 1.5, kap: 2.0, dil: 0.07 };   // tuned on real flex noise (see notes)

  function design(kind, f0) {                       // 2nd-order Butterworth biquad
    const w = 2 * Math.PI * f0 / FS, c = Math.cos(w), al = Math.sin(w) / (2 * SQ), a0 = 1 + al;
    return kind === 'hp'
      ? [(1 + c) / 2 / a0, -(1 + c) / a0, (1 + c) / 2 / a0, -2 * c / a0, (1 - al) / a0]
      : [(1 - c) / 2 / a0, (1 - c) / a0, (1 - c) / 2 / a0, -2 * c / a0, (1 - al) / a0];
  }
  function pass(x, co, rev) {                       // one biquad over the whole array, started at steady state
    const b0 = co[0], b1 = co[1], b2 = co[2], a1 = co[3], a2 = co[4], n = x.length;
    const u = rev ? x[n - 1] : x[0], yss = (b0 + b1 + b2) / (1 + a1 + a2) * u;
    let z2 = b2 * u - a2 * yss, z1 = b1 * u - a1 * yss + z2;
    if (!rev) for (let i = 0; i < n; i++) { const v = x[i], y = b0 * v + z1; z1 = b1 * v - a1 * y + z2; z2 = b2 * v - a2 * y; x[i] = y; }
    else for (let i = n - 1; i >= 0; i--) { const v = x[i], y = b0 * v + z1; z1 = b1 * v - a1 * y + z2; z2 = b2 * v - a2 * y; x[i] = y; }
  }
  function filtfilt(x, spec) {                      // zero-phase: forward then backward
    const y = Float64Array.from(x), cos = spec.map(s => design(s[0], s[1]));
    for (const co of cos) pass(y, co, false);
    for (const co of cos) pass(y, co, true);
    return y;
  }
  function rollMedian(a, size) {                    // centred running median, edges repeat the end value
    const n = a.length, out = new Float64Array(n); if (!n) return out;
    const half = size >> 1, mid = size >> 1;
    const at = j => { j -= half; return a[j < 0 ? 0 : (j > n - 1 ? n - 1 : j)]; };
    const w = new Float64Array(size);
    for (let k = 0; k < size; k++) w[k] = at(k);
    w.sort(); out[0] = w[mid];
    for (let i = 1; i < n; i++) {
      const old = at(i - 1), nw = at(i - 1 + size);
      if (old !== nw) {
        let lo = 0, hi = size - 1;
        while (lo < hi) { const m = (lo + hi) >> 1; if (w[m] < old) lo = m + 1; else hi = m; }
        let q = lo;
        if (nw > old) { while (q + 1 < size && w[q + 1] < nw) { w[q] = w[q + 1]; q++; } }
        else { while (q > 0 && w[q - 1] > nw) { w[q] = w[q - 1]; q--; } }
        w[q] = nw;
      }
      out[i] = w[mid];
    }
    return out;
  }
  function movmean(a, size) {
    const n = a.length, out = new Float64Array(n), h = size >> 1, cl = j => a[j < 0 ? 0 : (j > n - 1 ? n - 1 : j)];
    let s = 0; for (let j = -h; j <= h; j++) s += cl(j);
    out[0] = s / size;
    for (let i = 1; i < n; i++) { s += cl(i + h) - cl(i - 1 - h); out[i] = s / size; }
    return out;
  }
  function dilate(m, r) {
    const n = m.length, out = new Uint8Array(n); let last = -1e9, nxt = 1e9;
    for (let i = 0; i < n; i++) { if (m[i]) last = i; if (i - last <= r) out[i] = 1; }
    for (let i = n - 1; i >= 0; i--) { if (m[i]) nxt = i; if (nxt - i <= r) out[i] = 1; }
    return out;
  }
  // where the QRS complexes are: band-passed energy well above its own 3-second median
  function qrsMask(x, kap, dil) {
    const y = filtfilt(x, [['hp', 8], ['lp', 25]]);
    for (let i = 0; i < y.length; i++) y[i] = Math.abs(y[i]);
    const env = movmean(y, Math.round(0.06 * FS) | 1), base = rollMedian(env, 3 * FS);
    const m = new Uint8Array(x.length);
    for (let i = 0; i < x.length; i++) m[i] = env[i] > kap * base[i] ? 1 : 0;
    return dilate(m, Math.round(dil * FS));
  }
  // how noisy is it right now: median of the >15 Hz content (robust to the QRS itself)
  function noiseMeter(x) {
    const hp = filtfilt(x, [['hp', 15]]);
    for (let i = 0; i < hp.length; i++) hp[i] = Math.abs(hp[i]);
    const med = rollMedian(hp, Math.round(1.5 * FS) | 1);
    for (let i = 0; i < med.length; i++) med[i] /= 0.6745;
    return med;
  }
  function kalmanRTS(y, R, Q) {
    const n = y.length, dt = 1 / FS;
    const f0 = new Float64Array(n), f1 = new Float64Array(n), P0 = new Float64Array(n), P1 = new Float64Array(n), P2 = new Float64Array(n);
    const p0 = new Float64Array(n), p1 = new Float64Array(n), Q0 = new Float64Array(n), Q1 = new Float64Array(n), Q2 = new Float64Array(n);
    let x0 = y[0], x1 = 0, a = 1, b = 0, c = 10;
    for (let k = 0; k < n; k++) {
      if (k > 0) {
        const q = Q[k];
        x0 += dt * x1;
        const an = a + 2 * dt * b + dt * dt * c + q * dt ** 3 / 3, bn = b + dt * c + q * dt * dt / 2, cn = c + q * dt;
        a = an; b = bn; c = cn;
      }
      p0[k] = x0; p1[k] = x1; Q0[k] = a; Q1[k] = b; Q2[k] = c;
      const S = a + R[k], K0 = a / S, K1 = b / S, r = y[k] - x0;
      x0 += K0 * r; x1 += K1 * r;
      const an = (1 - K0) * a, bn = (1 - K0) * b, cn = c - K1 * b;
      a = an; b = bn; c = cn;
      f0[k] = x0; f1[k] = x1; P0[k] = a; P1[k] = b; P2[k] = c;
    }
    const o0 = Float64Array.from(f0), o1 = Float64Array.from(f1);
    for (let k = n - 2; k >= 0; k--) {
      const a00 = P0[k], a01 = P1[k], a11 = P2[k], b00 = Q0[k + 1], b01 = Q1[k + 1], b11 = Q2[k + 1];
      const det = b00 * b11 - b01 * b01, i00 = b11 / det, i01 = -b01 / det, i11 = b00 / det;
      const g00 = a00 + dt * a01, g01 = a01, g10 = a01 + dt * a11, g11 = a11;
      const c00 = g00 * i00 + g01 * i01, c01 = g00 * i01 + g01 * i11, c10 = g10 * i00 + g11 * i01, c11 = g10 * i01 + g11 * i11;
      const d0 = o0[k + 1] - p0[k + 1], d1 = o1[k + 1] - p1[k + 1];
      o0[k] = f0[k] + c00 * d0 + c01 * d1; o1[k] = f1[k] + c10 * d0 + c11 * d1;
    }
    return o0;
  }
  // x: Float64Array, one unbroken stretch of signal (mV). strength scales how hard it smooths (1 = tuned default).
  function denoiseRun(x, strength) {
    const n = x.length;
    if (n < 40) return { out: Float64Array.from(x), sig: new Float64Array(n), mask: new Uint8Array(n) };
    const P = PARAMS, sig = noiseMeter(x), R = new Float64Array(n), Q = new Float64Array(n);
    const mask = qrsMask(x, P.kap, P.dil), rho = P.rho * (strength || 1);
    for (let i = 0; i < n; i++) { const s = sig[i] * rho; R[i] = Math.max(s * s, 1e-4); Q[i] = mask[i] ? P.qh : P.ql; }
    return { out: kalmanRTS(x, R, Q), sig, mask };
  }
  // zero-phase high-pass for baseline removal in Review (forward and backward, so beats do not shift)
  function highpassZP(x, fc) { return filtfilt(x, [['hp', fc]]); }
  // R-peak finder for the heart-rate readout: band-passed slope energy, adaptive threshold, 0.28 s refractory
  function detectBeats(x) {
    const n = x.length; if (n < 2 * FS) return [];
    const y = filtfilt(x, [['hp', 6], ['lp', 20]]), d = new Float64Array(n);
    for (let i = 1; i < n - 1; i++) { const g = (y[i + 1] - y[i - 1]) / 2; d[i] = g * g; }
    const m = movmean(d, Math.round(0.08 * FS) | 1), sorted = Float64Array.from(m).sort();
    const thr = 0.3 * sorted[Math.floor(0.95 * (n - 1))], cand = [];
    for (let i = 1; i < n - 1; i++) if (m[i] >= thr && m[i] > m[i - 1] && m[i] >= m[i + 1]) cand.push(i);
    cand.sort((a, b) => m[b] - m[a]);
    const acc = [], refr = Math.round(0.28 * FS);
    for (const c of cand) if (acc.every(a => Math.abs(a - c) >= refr)) acc.push(c);
    acc.sort((a, b) => a - b);
    return acc.map(c => { let b = c, bv = -1; for (let j = Math.max(0, c - 15); j <= Math.min(n - 1, c + 15); j++) { const v = Math.abs(y[j]); if (v > bv) { bv = v; b = j; } } return b; });
  }
  return { denoiseRun, highpassZP, detectBeats, FS, PARAMS };
})();
/* DENOISER END */

/* ---------- filters (60 Hz notch + 40 Hz low-pass) ---------- */
class Biquad {
  constructor(b0, b1, b2, a1, a2) { Object.assign(this, { b0, b1, b2, a1, a2, z1: 0, z2: 0 }); }
  process(x) {
    const y = this.b0 * x + this.z1;
    this.z1 = this.b1 * x - this.a1 * y + this.z2;
    this.z2 = this.b2 * x - this.a2 * y;
    return y;
  }
  reset() { this.z1 = this.z2 = 0; }
}

  ctx.strokeStyle = GRID_MAJOR; ctx.lineWidth = 1.4; ctx.beginPath();
  for (let i = 0; i <= nx; i += 5) { const x = px(i * mm); ctx.moveTo(x, 0); ctx.lineTo(x, h); }
  for (let j = 0; j <= ny; j += 5) { const y = px(j * mm); ctx.moveTo(0, y); ctx.lineTo(w, y); }
  ctx.stroke();
}
function drawCalibration() {                 // standard 1 mV test pulse: 10 mm high, 5 mm wide
  const { h, mm } = L, x0 = 2 * mm, yb = h - 5 * mm;
  ctx.strokeStyle = TRACE; ctx.lineWidth = 1.6; ctx.lineJoin = 'miter'; ctx.beginPath();
  ctx.moveTo(x0, yb); ctx.lineTo(x0 + 2 * mm, yb); ctx.lineTo(x0 + 2 * mm, yb - 10 * mm);
  ctx.lineTo(x0 + 7 * mm, yb - 10 * mm); ctx.lineTo(x0 + 7 * mm, yb); ctx.lineTo(x0 + 9 * mm, yb);
  ctx.stroke();
  ctx.fillStyle = '#8a5c5c'; ctx.font = Math.max(10, 2.4 * mm) + 'px -apple-system,Segoe UI,sans-serif';
  ctx.fillText('1 mV', x0 + 10.5 * mm, yb - 4 * mm);
}
/* Gaps = stretches with no usable signal around each mux switch (erased bad part + settling).
   Splice mode removes them from the time axis so the two sides join into one line. */
function gapList() {
  const out = []; let prevE = -Infinity;
  for (const m of marks) {
    if (m.lbl) continue;                              // switching between two boards has no settling gap
    let g0 = m.from === undefined ? m.t : m.from;
    const g1 = m.t + (cfg.hideSettle ? SETTLE_S : 0);
    g0 = Math.max(g0, prevE);
    if (g1 <= g0) continue;
    out.push({ s: g0, e: g1 }); prevE = g1;
  }
  return out;
}
function shiftAt(gaps, t) {                 // total gap time removed before real time t
  let sh = 0;
  for (const g of gaps) { if (t <= g.s) break; sh += Math.min(t, g.e) - g.s; }
  return sh;
}
function inGap(gaps, t) { for (const g of gaps) if (t >= g.s && t <= g.e) return true; return false; }

function drawTrace(tView, gaps, useDen, color, lw, main, arr) {
  const A = arr || vs;
  const { w, h, mm } = L, win = cfg.win, yc = h / 2, pxPerS = MM_PER_S * mm, ppmv = MM_PER_MV * mm;
  const sweep = cfg.mode === 'sweep', gap = 0.45, gm = cfg.gapMode, spl = gm === 'splice';
  const T = t => spl ? t - shiftAt(gaps, t) : t;       // time as laid out on the paper
  const tv = T(tView);
  const from = sweep ? tv - win + gap : tv - win;
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  let pen = false, lastX = -1;
  for (let i = upper(ts, from); i < ts.length && ts[i] <= tView; i++) {
    let v = useDen ? dval(i) : A[i];
    if (gaps.length && inGap(gaps, ts[i])) {
      if (spl) continue;                               // joined: skip the gap, the pen stays down
      if (gm === 'flat') v = 0; else { pen = false; continue; }
    } else if (v !== v) { pen = false; continue; }     // leads off etc.
    const Tt = T(ts[i]);
    if (Tt < from) continue;
    const x = sweep ? (Tt % win) * pxPerS : (Tt - (tv - win)) * pxPerS;
    const y = Math.max(-5, Math.min(h + 5, yc - v * ppmv));
    if (pen && x < lastX) pen = false;                           // sweep wrapped around
    if (!pen) { ctx.moveTo(x, y); pen = true; } else ctx.lineTo(x, y);
    lastX = x;
  }
  ctx.stroke();
  if (sweep && main) {
    const xc = (tv % win) * pxPerS;
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(xc, 0); ctx.lineTo(xc, h); ctx.stroke();
  }
}
function drawMarks(tView, gaps) {
  const { w, h, mm } = L, win = cfg.win, pxPerS = MM_PER_S * mm, sweep = cfg.mode === 'sweep';
  const spl = cfg.gapMode === 'splice';
  const T = t => spl ? t - shiftAt(gaps, t) : t;
  const tv = T(tView), from = tv - win;
  const fs = Math.max(11, 2.6 * mm);
  const px = t => sweep ? (t % win) * pxPerS : (t - from) * pxPerS;
  ctx.save();
  ctx.font = '600 ' + fs + 'px -apple-system,Segoe UI,sans-serif';
  if (!spl) {                                          // shaded band over the gap (blank / flat modes)
    for (const m of marks) {
      if (m.lbl) continue;                              // two-board switches have no settling gap
      const a = Math.max(m.from === undefined ? m.t : m.from, from), b = Math.min(m.t + (cfg.hideSettle ? SETTLE_S : 0), tView);
      if (b <= a) continue;
      const x0 = px(a), x1 = px(b);
      ctx.fillStyle = 'rgba(47,111,237,0.09)';
      if (x1 >= x0) ctx.fillRect(x0, 0, x1 - x0, h);
      else { ctx.fillRect(x0, 0, w - x0, h); ctx.fillRect(0, 0, x1, h); }
      ctx.fillStyle = '#2f6fed'; ctx.setLineDash([]);
      ctx.fillText('settling…', x0 + 4, h - 8 - fs - 4);
    }
  }
  ctx.setLineDash([6, 4]); ctx.lineWidth = 1.5; ctx.strokeStyle = '#2f6fed'; ctx.fillStyle = '#2f6fed';
  for (const m of marks) {
    const tm = spl ? (m.from === undefined ? m.t : m.from) : m.t;   // splice: mark the join, not the switch
    const Tm = T(tm);
    if (Tm < from || Tm > tv) continue;
    const x = px(Tm);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    ctx.fillText(m.lbl ? '→ ' + m.lbl : (spl ? '✂ joined → C' : '→ C') + m.ch, x + 4, h - 8);
  }
  if (spl && inGap(gaps, tView)) {                     // waiting for the new electrode: the paper pauses
    ctx.setLineDash([]); ctx.textAlign = 'right';
    ctx.fillText('settling… paused', w - 10, h - 8);
  }
  ctx.restore();
}
let lastFrame = 0, lastRvText = '', lastRecText = '';
function frame(now) {
  requestAnimationFrame(frame);
  const dtr = lastFrame ? Math.min(0.25, (now - lastFrame) / 1000) : 0; lastFrame = now || 0;
  ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  drawGrid();
  let tShow = 0;
  const gaps = gapList();
  if (ts.length) {
    if (rv.on) {
      if (rv.playing) {
        rv.t += dtr * rv.speed;
        if (cfg.gapMode === 'splice') for (const g of gaps) if (rv.t > g.s && rv.t < g.e) rv.t = g.e;   // play straight over the joins
        if (rv.t >= rv.t1) { rv.t = rv.t1; rv.playing = false; }
      }
      tShow = rv.t;
    } else if (frozen) tShow = frozenAt;
    else {
      const latest = ts[ts.length - 1];
      tShow = latest - effDelay();
      if (cfg.gapMode === 'splice' && gaps.length) {
        // The paper keeps moving at normal speed. When it reaches a gap whose end has already arrived, jump over it.
        tShow = Math.min(latest, tShow + skip);
        for (const g of gaps) if (tShow > g.s && tShow < g.e && latest >= g.e) { skip += g.e - tShow; tShow = g.e; }
      }
    }
    if (dualSeen && cfg.other) drawTrace(tShow, gaps, false, '#2f6fed', 1.2, false, vo);
    if (cfg.denoise && cfg.under) drawTrace(tShow, gaps, false, TRACE_RAW, 1.6, false);
    drawTrace(tShow, gaps, cfg.denoise, TRACE, 2, true);
    drawMarks(tShow, gaps);
  } else {
    ctx.fillStyle = '#9a7b7b'; ctx.textAlign = 'center';
    ctx.font = '600 ' + Math.max(14, 3 * L.mm) + 'px -apple-system,Segoe UI,sans-serif';
    ctx.fillText('Press “Connect USB” or “Connect Bluetooth”, or “Demo” to preview', L.w / 2, L.h / 2 - 8);
    ctx.textAlign = 'start';
  }
  drawCalibration();
  const showOff = !rv.on && leadsOff && ts.length && !frozen;
  el.banner.hidden = !showOff;
  if (showOff) el.banner.textContent = leadsText;
  const dn = cfg.denoise ? ' · denoised' : '';
  el.tag.className = 'tag' + (rv.on ? ' rev' : frozen ? ' frozen' : (ts.length ? ' live' : ''));
  el.tag.textContent = rv.on ? 'REVIEW' + (cfg.denoise ? ' · denoised' : ' · raw')
    : frozen ? '❚❚ FROZEN — Space to resume'
    : (ts.length ? '● LIVE' + (effDelay() > 0 ? ' · ' + effDelay().toFixed(1) + ' s behind' : '') + dn : '');
  el.tag.hidden = !el.tag.textContent;
  {
    const tv = tShow;
    let shown = null;
    for (const e of chLog) if (e.t <= tv) shown = e.ch;
    if (shown === null && chLog.length) shown = chLog[0].ch;
    el.chTag.hidden = shown === null || !ts.length;
    if (shown !== null) el.chTag.textContent = dualSeen ? 'Board ' + 'AB'[shown] + (cfg.pick === 'auto' ? ' (best)' : '') + (!rv.on && !frozen ? ' · ' + noiseText() : '') : 'Electrode C' + shown;
    el.lblPick.hidden = !dualSeen;
  }
  if (ts.length && (!leadsOff || rv.on || frozen)) updateBpm(tShow, now || 0); else bpmVal = null;
  el.bpm.hidden = !ts.length;
  el.bpm.className = 'bpm' + (bpmVal === null ? ' dim' : '');
  el.bpm.innerHTML = '♥ ' + (bpmVal === null ? '--' : Math.round(bpmVal)) + ' <small>BPM</small>';
  if (rv.on && ts.length) {
    const txt = fmtT(tShow - rv.t0) + ' / ' + fmtT(rv.t1 - rv.t0) + (rv.playing ? '|p' : '|s');
    if (txt !== lastRvText) {
      lastRvText = txt;
      el.rvTime.textContent = txt.split('|')[0];
      el.rvPlay.textContent = rv.playing ? '❚❚ Pause' : '▶ Play';
    }
    drawTimeline(tShow);
  }
  if (rec.on && rec.n) {
    const txt = '■ Stop · ' + fmtT(rec.last - rec.t[0]);
    if (txt !== lastRecText) { lastRecText = txt; el.rec.textContent = txt; }
  }
}

layout();
requestAnimationFrame(frame);
if (window.top !== window.self) setStatus(NEED_CHROME + ' (Demo still works here)', 'warn');
})();
</script>
